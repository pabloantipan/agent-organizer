# The organizer's stages, in order (decision 0032). The current stage is the
# first without `done`. Method: the roadmapping skill. Dates only when real.
stages:
  - id: foundations
    title: The board and the redesign
    phase: building
    outcome: one board across machines, organized around the initiative
    exit:
      - text: the redesign's 11 cards and retire-keeps-the-cell passed review
        met: 2026-09-26
    done: 2026-09-27      # exit met, ruled in 0032
  - id: twenty-at-a-glance
    title: Twenty at a glance
    phase: building
    outcome: from Home the lead tells which initiatives execute, which are in discovery, which wait on business and which on him, without opening one
    exit:
      - initiative.yaml carries scope (in/out) and the organizer shows goal and scope on the header (0030)
      - each stage shows its phase; Home shows each initiative's current phase
      - every active initiative has a goal
      - '"what needs me" answered from Home in under a minute, 20 initiatives loaded (fixture)'
    gates: ["0029", "0030"]
    appetite: one wave
    done: 2026-09-28      # exit met, ruled in 0039
  - id: machine-explains-itself
    title: The machine explains itself
    phase: building
    outcome: a developer new to the factory learns the flow and diagnoses the mailbox from the app
    exit:
      - the Help shows how we follow the flow, from the business plain-text diagrams (0031)
      - a deaf or capped seat says why and what to restart, in the UI
    appetite: one wave
    done: 2026-09-28      # exit met, ruled in 0044
  - id: cheap-execution
    title: Execution costs the lead little
    phase: building
    outcome: waves run through supervisors and the lead only rules
    exit:
      - the FSE pilot is judged keep or drop on pablo_minutes, gate_rework and decide_turnaround (0005)
    done: 2026-09-28      # exit met, ruled in 0046
  - id: discovery-in-a-cell
    title: Discovery has a shape and runs in a cell
    phase: building
    outcome: an initiative in discovery has a cell fed with its business context, and its move to building is a ruled record
    exit:
      - text: a cell being defined shows as such, with seats drafted from goal, scope and people.md (on the fixture; the first real draft is watched, not gated, 0097)
        met: 2026-09-29
      # camp's move from discovery to building is camp's gate, on camp's roadmap (0097)
    done: 2026-10-06      # closed by 0097
    forecast:              # recomputed by the FSE (docs/estimating.md), never hand-set
      range: "no cards left: amendment 1 landed in 37 min over 2 waves (forecast 40–65)"
      waves: 0
      waits: "exit (a): a draft shown on a real initiative (Pablo); exit (b) is camp's"
      basis: "23 cards in 10 single-wave tasks, this initiative"
      as_of: 2026-09-29
  - id: one-window
    title: Deltagos is the lead's one window
    phase: building
    outcome: the lead reads, rules and plans every initiative from Deltagos, on any desktop, without a terminal for status
    exit:
      - text: Deltagos is one click away on every desktop (floating icon, 0088-0092)
        met: 2026-10-06    # floating-icon-2 merged, 74e9b0a
      - text: a decision is read and ruled in the app with the record in view (decisions-view, rule-box-and-stages)
        met: 2026-10-04    # rule-box-and-stages, the last of them, in done/
      - "the Roadmap reads as a plan: stages, waves, iterations, cards and decisions at four levels (0093)"
      - no UI leftover older than one batch (leftovers-13 landed)
    gates: ["0093"]
    appetite: three waves    # the roadmap view, leftovers-13, one spare (0094)
  - id: decisions-owned-and-used
    title: Decisions have real owners, and their data is used
    phase: building
    outcome: business people's decisions are recorded as theirs, and turnaround and waits across initiatives drive changes
    exit:
      - records owned by someone other than the lead exist on at least one initiative
      - one change traced to decision data
    gates: []             # identity: a new record reopening 0004, raised when this stage comes up
