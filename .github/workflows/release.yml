name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      # secrets are not readable from a step's `if`; only a job-level env can see them
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    # The organizer and the contract samples are checked out side by side
    # (leftovers-54 FR-2): a path inside the organizer's checkout would show as
    # untracked in its git status. Every run step works in organizer/.
    defaults:
      run:
        working-directory: organizer
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, path: organizer }
      # The contract samples the contract tests read (TestWorkingOnContract,
      # the usage sample), pinned; no vendored copy. A later card moves the ref.
      - uses: actions/checkout@v4
        with:
          repository: pabloantipan/agent-mailbox-specs
          ref: 54cf10da4fcbae240a8abb7ee8353fd4e8c5bafa
          path: agent-mailbox-specs
      - uses: actions/setup-go@v5
        with: { go-version-file: organizer/go.mod }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: organizer/frontend/pnpm-lock.yaml }
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      # main.go embeds frontend/dist, so the Go packages do not compile until
      # the frontend is built (leftovers-15 FR-13); make test then skips both.
      - name: Build frontend
        working-directory: organizer/frontend
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Test
        env:
          CONTRACTS_DIR: ${{ github.workspace }}/agent-mailbox-specs/contracts
        run: make test
      # Through make, so the bundle carries build/darwin/iconfile.icns (with its
      # 16 and 32 px cuts) and Assets.car, not the icns Wails generates.
      - name: Build universal app
        run: make build PLATFORM=darwin/universal VERSION="${GITHUB_REF_NAME:-dev}"
      # Signing and notarization run only when the secrets exist. Without them
      # the DMG is unsigned and the READ ME inside explains the quarantine step.
      - name: Sign and notarize
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/sign-and-notarize.sh build/bin/Deltagos.app
      - name: Package DMG
        run: scripts/make-dmg.sh build/bin/Deltagos.app "build/bin/Deltagos-${GITHUB_REF_NAME:-dev}.dmg"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            organizer/build/bin/*.dmg
            organizer/build/bin/*.dmg.sha256
          generate_release_notes: true
