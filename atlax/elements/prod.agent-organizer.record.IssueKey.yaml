# Deltagos's call to the record that issues a factory key (atlax-seed FR-2;
# consumes: added by Amendment 3, FR-5, once agent-mailbox-record published).
designation: prod:agent-organizer.record.IssueKey
kind: outbound
summary: "organizer factory-key asks the record (agent-mailbox-record) for a factory key as the signed-in developer."
authored: false
lifecycle: live
owner: organizer-fse
terminal:
  method: POST
  path: /v1/factories/keys
consumes:
  - ext:agent-mailbox-record#fn:record.factories.keys.issue
test:
  path: internal/record/record_test.go
  name: TestIssueRevokeAndRegister
