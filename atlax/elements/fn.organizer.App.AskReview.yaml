# A Go method bound to Deltagos's window by Wails (main.go Bind:), derived by atlax derive at app.go (atlax-seed Amendment 4, FR-7).
designation: fn:organizer.App.AskReview
kind: wails
summary: "Saves a question or block on a symbol of a card's review map and asks the addressee in the review's thread, as the cell's human."
authored: false
lifecycle: live
owner: organizer-fse
terminal:
  binding: App.AskReview
  signature: "(string, string, string, string, string, string) (service.ReviewAsk, error)"
consumes:
  - ext:agent-mailbox-api#fn:mailbox.health
  - ext:agent-mailbox-api#fn:mailbox.messages.post
