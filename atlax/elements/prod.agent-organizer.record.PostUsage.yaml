# Deltagos's usage post to the record (atlax-seed FR-2: both a reader with a
# contract sample, usage-batch.json, and one of the record's four calls, so one
# element). Amendment 3: consumes: the record's published usage post (FR-5),
# and authored (FR-6): the named test reads the sample through CONTRACTS_DIR
# and checks the batch and row keys of the post against it.
designation: prod:agent-organizer.record.PostUsage
kind: outbound
summary: "Posts the usage ledger's rows, at most 500 per batch, with the factory key to the record (agent-mailbox-record)."
authored: true
lifecycle: live
owner: organizer-fse
terminal:
  method: POST
  path: /v1/usage
consumes:
  - ext:agent-mailbox-record#fn:record.usage.post
contract:
  repo: specs
  path: contracts/usage-batch.json
test:
  path: internal/service/usagepost_test.go
  name: TestU1PostsThreeRowsWithContractKeys
