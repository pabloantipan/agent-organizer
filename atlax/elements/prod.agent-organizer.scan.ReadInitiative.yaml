# Deltagos's working-on reader (atlax-seed FR-2): the scan of an initiative
# root's working-on/ (initiative.yaml, cards, decisions, roadmap, runs).
# The format is the working-on skill's, sampled in the specs repo's
# contracts/working-on/ (sample/ and expected.json); no published artifact
# owns it, so no consumes: (Amendment 1). Authored (Amendment 3, FR-6): the
# named test reads the sample through CONTRACTS_DIR, field by field.
designation: prod:agent-organizer.scan.ReadInitiative
kind: data
summary: "Reads an initiative root's working-on/ files into the board; format owned by the working-on skill (contracts/working-on/, no published artifact)."
authored: true
lifecycle: live
owner: organizer-fse
terminal:
  store: working-on/
  entity: card
contract:
  repo: specs
  path: contracts/working-on/
test:
  path: internal/scan/contract_test.go
  name: TestWorkingOnContract
