# Deltagos's read of the mailbox's thread list (atlax-seed FR-2; the consumer
# sample in contracts/atlax/element-consumer.sample.yaml). Unauthored: the
# consumes: line is what lets atlax check tell the organizer's FSE when the
# thread list changes.
designation: prod:agent-organizer.discuss.ThreadsByStatus
kind: outbound
summary: Reads the mailbox's thread list, one status per call, for Conversations, Needs me and the archive.
authored: false
lifecycle: live
owner: organizer-fse
terminal:
  method: GET
  path: /projects/{pid}/threads
consumes:
  - ext:agent-mailbox-api#fn:mailbox.threads.list
test:
  path: internal/discuss/client_test.go
  name: TestClientRoundTrips
