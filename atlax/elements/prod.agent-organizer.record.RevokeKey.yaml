# Deltagos's call to the record that revokes a factory key by its sha256
# (atlax-seed FR-2; consumes: added by Amendment 3, FR-5).
designation: prod:agent-organizer.record.RevokeKey
kind: outbound
summary: "organizer factory-key --rotate revokes the old key by hash at the record (agent-mailbox-record)."
authored: false
lifecycle: live
owner: organizer-fse
terminal:
  method: POST
  path: /v1/factories/{f}/keys/revoke
consumes:
  - ext:agent-mailbox-record#fn:record.factories.keys.revoke
test:
  path: internal/record/record_test.go
  name: TestIssueRevokeAndRegister
